[package]
name = "freepalette-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Background state owner for freepalette."

[[bin]]
name = "freepalette-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dependencies.freepalette-core]
path = "../freepalette-core"

[target.'cfg(windows)'.dependencies.global-hotkey]
version = "0.8.0"

[target.'cfg(windows)'.dependencies.tao]
version = "0.35.3"
default-features = false

[lints]
workspace = true
