[package]
name = "freepalette-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Minimal Tauri desktop shell for freepalette."

[[bin]]
name = "freepalette-ui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
tauri.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dependencies.freepalette-core]
path = "../freepalette-core"

[dependencies.freepalette-daemon]
path = "../freepalette-daemon"

[target.'cfg(windows)'.dependencies.global-hotkey]
version = "0.8.0"

[target.'cfg(windows)'.dependencies.tray-icon]
version = "0.24.0"
default-features = false
features = [
    "common-controls-v6",
]

[target.'cfg(windows)'.dependencies.win-desktop-utils]
version = "0.5.7"
default-features = false
features = [
    "shortcuts",
]

[build-dependencies]
tauri-build.workspace = true

[lints]
workspace = true
