<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>freepalette</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="palette">

        class="search"

    </main>
    <script src="./main.js"></script>
  </body>
</html>
