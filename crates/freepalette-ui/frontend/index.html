<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>freepalette</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="palette">
      <div class="topbar">
        <button id="settings-toggle" class="icon-button" type="button">
          Settings
        </button>
      </div>
      <input
        id="search"
        class="search"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search"
      />
      <ol id="results" class="results"></ol>
      <div id="action-panel" class="action-panel" hidden></div>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <section id="settings-panel" class="settings-panel" hidden>
      <div class="settings-card">
        <div class="settings-heading">
          <h2>Settings</h2>
          <button id="settings-close" class="secondary-button" type="button">
            Close
          </button>
        </div>
        <dl class="settings-list">
          <div>
            <dt>Providers</dt>
            <dd id="settings-providers" class="settings-checks"></dd>
          </div>
          <div>
            <dt>Clipboard capture</dt>
            <dd>
              <label class="toggle-row">
                <input id="clipboard-capture" type="checkbox" />
                Enabled
              </label>
            </dd>
          </div>
          <div>
            <dt>Clipboard items</dt>
            <dd id="settings-clipboard-count"></dd>
          </div>
          <div>
            <dt>Recent actions</dt>
            <dd id="settings-recent-count"></dd>
          </div>
          <div>
            <dt>Hotkey</dt>
            <dd id="settings-hotkey"></dd>
          </div>
          <div>
            <dt>Local state</dt>
            <dd id="settings-state-path"></dd>
          </div>
          <div>
            <dt>Backend</dt>
            <dd id="settings-daemon-connection"></dd>
          </div>
        </dl>
        <div class="settings-actions">
          <button id="clipboard-record" class="secondary-button" type="button">
            Record Clipboard
          </button>
          <button id="clipboard-clear" class="secondary-button" type="button">
            Clear Clipboard
          </button>
          <button id="settings-reload" class="secondary-button" type="button">
            Reload Config
          </button>
        </div>
      </div>
    </section>
    <section
      id="shell-confirmation"
      class="shell-confirmation"
      aria-live="assertive"
      hidden
    >
      <div class="shell-confirmation-panel" role="dialog" aria-modal="true">
        <p class="shell-confirmation-title">Run shell command?</p>
        <code id="shell-command" class="shell-command"></code>
        <div class="shell-confirmation-actions">
          <button id="cancel-shell" class="secondary-button" type="button">
            Cancel
          </button>
          <button id="confirm-shell" class="danger-button" type="button">
            Run
          </button>
        </div>
      </div>
    </section>
    <script src="./main.js"></script>
  </body>
</html>
